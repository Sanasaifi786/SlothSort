[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slothsort"
version = "0.1.0"
description = "A lazy, private, offline file tidier powered by local open-weight AI."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ollama>=0.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
slothsort = "slothsort.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
